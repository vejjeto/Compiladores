<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport lo estoy probando" content="width=device-width, initial-scale=1" />
	<title>Inicia</title>
	<style>
		body{font-family:Segoe UI, Roboto, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f5f7fa}
		.card{background:#fff;padding:2rem 2.5rem;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,50,0.08);text-align:center}
		button{padding:0.6rem 1.2rem;border:0;border-radius:6px;background:#0366d6;color:#fff;font-size:1rem;cursor:pointer}
	</style>
</head>
<body>
	<div class="card">
		<h1>Inicia</h1>
		<p id="msg">Presiona el botón para iniciar.</p>
		<button id="start">Iniciar</button>
	</div>

	<script>
		document.getElementById('start').addEventListener('click', function(){
			document.getElementById('msg').textContent = '¡Proceso iniciado!';
			this.disabled = true;
			this.textContent = 'Iniciado';
		});
	</script>
</body>
</html>
